# Throwaway Postgres for integration and performance tests. Separate from docker-compose.yml so a
# test run can never touch development or production data. No volume: state is disposable by design.
#
# Its own project name. Sharing the default one (the directory, `cedo`) made each file report the
# other's container as an "orphan" on every `bun run db:up`, and suggest `--remove-orphans` — which,
# run against this file, removes the DEVELOPMENT database container.
name: cedo-test
services:
  test-db:
    image: postgres:18-alpine
    # random_page_cost matches production, or the perf suite would measure plans nobody gets.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,auto_explain
      -c pg_stat_statements.max=500
      -c random_page_cost=1.1
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    environment:
      POSTGRES_USER: cedo
      POSTGRES_PASSWORD: cedo
      POSTGRES_DB: cedo_test
    tmpfs:
      # Durability is worthless here and costs real time in the perf suite's 250k-row seed.
      - /var/lib/postgresql
    ports:
      - '${TEST_POSTGRES_PORT:-55433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cedo -d cedo_test']
      interval: 2s
      timeout: 3s
      retries: 15
