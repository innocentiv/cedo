# Three containers, one published port. See docs/09-deployment.md.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # pg_stat_statements and auto_explain make a stranger's slow instance diagnosable remotely,
    # through GET /api/admin/slow-queries and the db_slow_queries MCP tool.
    # See docs/adr/0018-n1-detection.md.
    #
    # random_page_cost: the Postgres default of 4 models a spinning disk. Every machine this
    # realistically runs on has SSD or NVMe, and at the default the planner refuses the trigram
    # index on exercise search and sequentially scans instead — measured at 20k rows,
    # 5.96ms / 354 buffers versus 0.077ms / 17 buffers. See docs/05-database.md.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,auto_explain
      -c pg_stat_statements.max=500
      -c pg_stat_statements.track=top
      -c auto_explain.log_min_duration=200ms
      -c auto_explain.log_analyze=on
      -c auto_explain.log_buffers=on
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cedo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cedo}
    volumes:
      # Postgres 18+ wants the mount at /var/lib/postgresql, NOT /var/lib/postgresql/data, so the
      # cluster lives in a version subdirectory and `pg_upgrade --link` works across major versions
      # without a mount-point boundary. Getting this wrong makes future upgrades painful for
      # everyone self-hosting. See docs/09-deployment.md.
      - pgdata:/var/lib/postgresql
    ports:
      # LOOPBACK ONLY, and that is the default on purpose. Bound to 0.0.0.0 this put the database on
      # the whole LAN — and on the internet behind a NAS with a forwarded port — with the password
      # from .env, while the docs promised "one port to open". Nobody following the quick start
      # deletes a mapping, so the safe shape has to be the one they get.
      #
      # Set POSTGRES_BIND=0.0.0.0 to reach it from another machine, deliberately.
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cedo} -d ${POSTGRES_DB:-cedo}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Composed here rather than read from .env, so the host is always the service name and a
      # DATABASE_URL left pointing at localhost cannot silently break the deployment.
      DATABASE_URL: postgres://${POSTGRES_USER:-cedo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cedo}
      PORT: 3000
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
      CEDO_CURATOR_USERNAME: ${CEDO_CURATOR_USERNAME:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # NOT published. The only way in is through the web container's proxy, which is what keeps the
    # deployment to one open port.
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The proxies Caddy believes about who a client is, for the login limit (ADR-0031). Unset,
      # none: set it only behind a proxy that SETS X-Forwarded-For — see .env.example.
      CEDO_TRUSTED_PROXIES: ${CEDO_TRUSTED_PROXIES:-}
    ports:
      # The ONLY host mapping. Browser, API and MCP all arrive here. WEB_BIND=127.0.0.1 behind a
      # reverse proxy on the same host, which terminates TLS — see docs/09-deployment.md.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
