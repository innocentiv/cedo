<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- `viewport-fit=cover`: installed on iOS the app draws to the screen's bottom edge, under the
         home indicator, and the safe-area insets react-native-safe-area-context reads are only
         non-zero with it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>cedo</title>

    <!-- Installable: the manifest for Android and desktop, and what iOS reads instead of it.
         Colours from src/ui/tokens.ts. See docs/09-deployment.md, "Installing the app". -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1b1c1e" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="cedo" />
    <!-- No `apple-mobile-web-app-status-bar-style`, deliberately (#61): iOS draws its own opaque
         status bar, tinted by `theme-color`, and the page starts below it — sized to the screen,
         which `black-translucent` on iOS 26 was not (below). iOS reads this when the app is added:
         an install made before keeps the old style until it is removed and added again. -->

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* `color.bg`, src/ui/tokens.ts: the floor the app draws on, before it has drawn. */
        background-color: #1b1c1e;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Every scrollbar in the app's own colours, not the browser's light one: the grey of a line
         (`border`) on the floor (`bg`), from src/ui/tokens.ts. Kept, not hidden: on a desktop it is
         the only cue that a column scrolls on its own (#50). Inherited, so said once. */
      html {
        scrollbar-color: #3a3b40 #1b1c1e;
      }
      /* For an iPhone install made while the app asked for `black-translucent` (above), which keeps
         that style until it is added again. There iOS 26 sizes the page one status bar SHORT:
         `100%`, `dvh` and `svh` all leave ~59pt of the body showing below the tab bar, and every
         sheet and its scrim stop as high (#61). Only `lvh` reports the whole screen. The page is the
         short height plus the inset it lost, capped at the screen: once the page is as tall as the
         screen, iOS gives it the whole viewport, and what is fixed to the bottom reaches it too.
         The inset is 0 wherever nothing draws under a status bar — an install made since, Android,
         a desktop, a Safari tab — so there it changes nothing. */
      @media (display-mode: standalone) {
        html {
          height: min(100lvh, calc(100% + env(safe-area-inset-top)));
        }
      }
      /* Installed on an iPhone, iOS 26 blurs the top ~30pt of the page — under either status bar
         style, as it blurs a native app under its header (#61); a title at rest sat half in it. The
         page starts 12pt lower, so at rest a title's capitals clear the blur, and what scrolls
         there takes it, as a native list does. In those 12pt, a strip of the floor fixed to the
         edge: a fixed, opaque, full-width box over the edge is reported to make iOS paint its
         colour in place of the blur — a real element, as a pseudo-element was not taken for one.
         `-webkit-touch-callout` is iOS's own: Android and desktops are left as they were. */
      #top-edge {
        display: none;
      }
      @media (display-mode: standalone) {
        @supports (-webkit-touch-callout: none) {
          #root {
            box-sizing: border-box;
            padding-top: 12px;
          }
          #top-edge {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            background-color: #1b1c1e;
            z-index: 1;
          }
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="top-edge"></div>
    <div id="root"></div>
  </body>
</html>
