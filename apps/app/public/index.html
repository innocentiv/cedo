<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- `viewport-fit=cover`: installed on iOS the app draws under the notch, and the safe-area
         insets react-native-safe-area-context reads are only non-zero with it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>cedo</title>

    <!-- Installable: the manifest for Android and desktop, and what iOS reads instead of it.
         Colours from src/ui/tokens.ts. See docs/09-deployment.md, "Installing the app". -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1b1c1e" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="cedo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* `color.bg`, src/ui/tokens.ts: the floor the app draws on, before it has drawn. */
        background-color: #1b1c1e;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Every scrollbar in the app's own colours, not the browser's light one: the grey of a line
         (`border`) on the floor (`bg`), from src/ui/tokens.ts. Kept, not hidden: on a desktop it is
         the only cue that a column scrolls on its own (#50). Inherited, so said once. */
      html {
        scrollbar-color: #3a3b40 #1b1c1e;
      }
      /* Installed on an iPhone (iOS 26), `black-translucent` draws the app under the status bar but
         sizes the page one status bar SHORT: `100%`, `dvh` and `svh` all leave ~59pt of the body
         showing below the tab bar, and every sheet and its scrim stop as high (#61). Only `lvh`
         reports the whole screen. The page is the short height plus the inset it lost, capped at
         the screen: once the page is as tall as the screen, iOS gives it the whole viewport, and
         what is fixed to the bottom reaches it too. The inset is 0 wherever nothing drew under a
         status bar — Android, a desktop, a Safari tab (not standalone) — so there it changes
         nothing. */
      @media (display-mode: standalone) {
        html {
          height: min(100lvh, calc(100% + env(safe-area-inset-top)));
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
